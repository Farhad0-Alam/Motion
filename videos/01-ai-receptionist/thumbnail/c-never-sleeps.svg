<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Variant C · "NEVER SLEEPS" · identity hook: the AI that works the night shift (echoes the iAgentice tagline) -->
  <defs>
    <style>
      @font-face { font-family: "Instrument Sans"; font-weight: 400 700; src: url("../assets/fonts/InstrumentSans-400_700.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 600; src: url("../assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
      .sans { font-family: "Instrument Sans", sans-serif; font-weight: 700; }
      .mono { font-family: "IBM Plex Mono", monospace; font-weight: 600; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#151b1e" />
      <stop offset="0.55" stop-color="#151a24" />
      <stop offset="1" stop-color="#211a44" />
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#c8f04f" stop-opacity="0.9" />
      <stop offset="0.45" stop-color="#c8f04f" stop-opacity="0.35" />
      <stop offset="1" stop-color="#c8f04f" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" />
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)" />
  <rect width="1280" height="720" fill="url(#grid)" />
  <g fill="#ffffff" opacity="0.6">
    <circle cx="820" cy="80" r="2.5" /><circle cx="1010" cy="40" r="2" /><circle cx="1220" cy="160" r="2.5" />
    <circle cx="760" cy="230" r="1.8" /><circle cx="1180" cy="560" r="2" /><circle cx="740" cy="620" r="2.2" />
  </g>

  <g transform="translate(56 50) scale(0.9)">
    <rect width="64" height="64" rx="14" fill="#101215" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />
    <path d="M22.2 55.22V18.18h7.78L46 55.22h-8.47l-3.46-8h-4.09v8zM29.98 41h1.39l-1.39-3.23z" fill="#f3f4f1" fill-rule="evenodd" />
    <circle cx="26.09" cy="9.55" r="5.52" fill="#c8f04f" />
  </g>

  <!-- AI core on the night side: the agent awake while everything else sleeps -->
  <g transform="translate(960 360)">
    <circle r="300" fill="url(#core)" opacity="0.55" />
    <circle r="200" fill="none" stroke="#9385ff" stroke-opacity="0.5" stroke-width="4" stroke-dasharray="6 14" />
    <circle r="150" fill="#1b2126" stroke="#c8f04f" stroke-width="8" />
    <!-- chat bubble with "eyes": friendly, awake agent -->
    <path d="M-78 -54h156a26 26 0 0 1 26 26v74a26 26 0 0 1 -26 26h-78l-44 36v-36h-34a26 26 0 0 1 -26 -26v-74a26 26 0 0 1 26 -26z" fill="#c8f04f" />
    <rect x="-46" y="-16" width="22" height="40" rx="11" fill="#12171a" />
    <rect x="24" y="-16" width="22" height="40" rx="11" fill="#12171a" />
    <!-- moon orbit -->
    <path d="M150 -205a38 38 0 1 0 25 60a33 33 0 1 1 -25 -60z" fill="#c9c1ff" />
  </g>

  <!-- headline -->
  <text x="56" y="250" class="mono" font-size="44" fill="#b9c3ba" letter-spacing="2">AI RECEPTIONIST</text>
  <text x="50" y="410" class="sans" font-size="168" fill="#f3f6f1" letter-spacing="-6">NEVER</text>
  <text x="50" y="570" class="sans" font-size="168" fill="#c8f04f" letter-spacing="-6">SLEEPS</text>
</svg>
