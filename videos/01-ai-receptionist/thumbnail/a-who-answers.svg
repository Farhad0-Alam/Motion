<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Variant A · "WHO ANSWERS?" · curiosity hook: a 3 AM message, answered by AI -->
  <defs>
    <style>
      @font-face { font-family: "Instrument Sans"; font-weight: 400 700; src: url("../assets/fonts/InstrumentSans-400_700.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 600; src: url("../assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
      .sans { font-family: "Instrument Sans", sans-serif; font-weight: 700; }
      .mono { font-family: "IBM Plex Mono", monospace; font-weight: 600; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151b1e" />
      <stop offset="0.6" stop-color="#141826" />
      <stop offset="1" stop-color="#1f1840" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c8f04f" stop-opacity="0.55" />
      <stop offset="1" stop-color="#c8f04f" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9385ff" stop-opacity="0.45" />
      <stop offset="1" stop-color="#9385ff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" />
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)" />
  <rect width="1280" height="720" fill="url(#grid)" />
  <!-- night sky -->
  <circle cx="1150" cy="70" r="150" fill="url(#moonglow)" />
  <path d="M1176 34a46 46 0 1 0 30 72a40 40 0 1 1 -30 -72z" fill="#c9c1ff" />
  <g fill="#ffffff" opacity="0.55">
    <circle cx="760" cy="60" r="2.5" /><circle cx="980" cy="150" r="2" /><circle cx="1240" cy="220" r="2.5" />
    <circle cx="860" cy="210" r="1.8" /><circle cx="1060" cy="40" r="1.8" />
  </g>

  <!-- brand mark -->
  <g transform="translate(56 50) scale(0.9)">
    <rect width="64" height="64" rx="14" fill="#101215" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />
    <path d="M22.2 55.22V18.18h7.78L46 55.22h-8.47l-3.46-8h-4.09v8zM29.98 41h1.39l-1.39-3.23z" fill="#f3f4f1" fill-rule="evenodd" />
    <circle cx="26.09" cy="9.55" r="5.52" fill="#c8f04f" />
  </g>

  <!-- time chip -->
  <g transform="translate(60 170)">
    <rect width="300" height="74" rx="37" fill="#9385ff" fill-opacity="0.18" stroke="#9385ff" stroke-width="3" />
    <text x="150" y="50" text-anchor="middle" class="mono" font-size="40" fill="#c9c1ff">3:02 AM</text>
  </g>

  <!-- headline: 2 words, lime on the key word -->
  <text x="52" y="420" class="sans" font-size="162" fill="#f3f6f1" letter-spacing="-5">WHO</text>
  <text x="52" y="580" class="sans" font-size="162" fill="#c8f04f" letter-spacing="-5">ANSWERS?</text>

  <!-- phone -->
  <g transform="translate(935 175) rotate(7) scale(0.88)" filter="url(#shadow)">
    <rect x="0" y="0" width="380" height="700" rx="54" fill="#1b2126" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4" />
    <rect x="140" y="20" width="100" height="22" rx="11" fill="#0f1416" />
    <!-- customer message -->
    <rect x="28" y="90" width="300" height="118" rx="28" fill="#2b333b" />
    <text x="54" y="140" class="sans" font-size="34" fill="#f3f6f1">Are you open</text>
    <text x="54" y="184" class="sans" font-size="34" fill="#f3f6f1">tomorrow?</text>
    <!-- AI reply with glow -->
    <circle cx="200" cy="330" r="200" fill="url(#glow)" />
    <rect x="52" y="250" width="300" height="160" rx="28" fill="#c8f04f" />
    <text x="80" y="306" class="sans" font-size="36" fill="#12171a">Yes! Here's</text>
    <text x="80" y="352" class="sans" font-size="36" fill="#12171a">your quote</text>
    <text x="80" y="392" class="mono" font-size="22" fill="#12171a" opacity="0.75">AI · replied in 4s</text>
  </g>
</svg>
