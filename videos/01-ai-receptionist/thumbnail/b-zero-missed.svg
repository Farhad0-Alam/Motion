<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Variant B · "0 MISSED LEADS" · outcome/benefit hook: leads arrive overnight -->
  <defs>
    <style>
      @font-face { font-family: "Instrument Sans"; font-weight: 400 700; src: url("../assets/fonts/InstrumentSans-400_700.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 600; src: url("../assets/fonts/IBMPlexMono-600.woff2") format("woff2"); }
      .sans { font-family: "Instrument Sans", sans-serif; font-weight: 700; }
      .mono { font-family: "IBM Plex Mono", monospace; font-weight: 600; }
    </style>
    <radialGradient id="bg" cx="0.3" cy="0.45" r="0.9">
      <stop offset="0" stop-color="#22301f" />
      <stop offset="0.55" stop-color="#151b1e" />
      <stop offset="1" stop-color="#0f1416" />
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c8f04f" stop-opacity="0.5" />
      <stop offset="1" stop-color="#c8f04f" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" />
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)" />
  <rect width="1280" height="720" fill="url(#grid)" />

  <g transform="translate(56 50) scale(0.9)">
    <rect width="64" height="64" rx="14" fill="#101215" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />
    <path d="M22.2 55.22V18.18h7.78L46 55.22h-8.47l-3.46-8h-4.09v8zM29.98 41h1.39l-1.39-3.23z" fill="#f3f4f1" fill-rule="evenodd" />
    <circle cx="26.09" cy="9.55" r="5.52" fill="#c8f04f" />
  </g>

  <!-- a plain, unmistakable "0" in the headline face, lime as the single accent -->
  <ellipse cx="185" cy="300" rx="220" ry="230" fill="url(#glow)" />
  <text x="40" y="440" class="sans" font-size="400" fill="#c8f04f" letter-spacing="-10">0</text>

  <!-- headline: 0 MISSED / LEADS -->
  <text x="390" y="395" class="sans" font-size="156" fill="#f3f6f1" letter-spacing="-5">MISSED</text>
  <text x="56" y="610" class="sans" font-size="156" fill="#f3f6f1" letter-spacing="-5">LEADS</text>

  <!-- overnight lead cards (kept clear of the bottom-right duration badge) -->
  <g filter="url(#shadow)">
    <g transform="translate(600 520)">
      <rect width="230" height="96" rx="20" fill="#1b2126" stroke="#c8f04f" stroke-opacity="0.7" stroke-width="3" />
      <text x="22" y="40" class="mono" font-size="24" fill="#c8f04f">NEW LEAD</text>
      <text x="22" y="76" class="sans" font-size="30" fill="#f3f6f1">11:47 PM</text>
    </g>
    <g transform="translate(850 520)">
      <rect width="230" height="96" rx="20" fill="#1b2126" stroke="#c8f04f" stroke-opacity="0.7" stroke-width="3" />
      <text x="22" y="40" class="mono" font-size="24" fill="#c8f04f">NEW LEAD</text>
      <text x="22" y="76" class="sans" font-size="30" fill="#f3f6f1">3:04 AM</text>
    </g>
  </g>
  <!-- moon: overnight -->
  <path d="M1150 70a52 52 0 1 0 34 82a45 45 0 1 1 -34 -82z" fill="#c9c1ff" />
</svg>
